[project]
name = "masked-linformer"
version = "0.1.0"
description = "Linformer self-attention with padding masks applied before the sequence projection, plus mask-aware rescaling"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masked_linformer.py"]
